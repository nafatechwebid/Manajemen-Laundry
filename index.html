<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LaundryKu</title>
<script src="config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>@page{margin:8mm}html{-webkit-text-size-adjust:100%}@media print{body *{visibility:hidden}.pa,.pa *{visibility:visible}.pa{position:absolute;left:0;top:0;width:100%}}</style>
</head><body class="bg-slate-100 text-slate-800"><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useContext}=React;
const LS=k=>localStorage.getItem(k)||'';
const CFG=window.CFG||{};document.title=CFG.name||'LaundryKu';
const real=v=>v&&!/XXXXXXXX|ISI_ANON/.test(v);const SU=real(CFG.url)?CFG.url:LS('su'),SK=real(CFG.key)?CFG.key:LS('sk');let sb=null;try{if(SU&&SK)sb=supabase.createClient(SU,SK)}catch(e){}
const okUrl=u=>/^https:\/\/[a-z0-9-]+\.supabase\.co\/storage\//.test(u||'')?u:'#';
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const td=()=>new Date().toISOString().slice(0,10);
const ST=['Dipesan','Dijemput','Antrean','Dicuci','Selesai','Diterima'];
const WASH=[{n:'Mesin 1',cap:10},{n:'Mesin 2',cap:10},{n:'Mesin 3',cap:15}];
const KOMISI=3000;
const wl=o=>o.services.unit==='kg'?Math.min(15,+o.qty):Math.min(15,Math.ceil(o.qty/2));
const calc=(s,q,ex)=>Math.round((s.min_price!=null&&s.min_qty>0?+s.min_price+Math.ceil(Math.max(q-s.min_qty,0))*(+s.extra_price||0):s.price*q)*(ex?s.express_multiplier:1));
const fd=d=>new Date(d).toLocaleString('id-ID',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const wibDate=d=>new Date((d?+new Date(d):Date.now())+7*36e5).toISOString().slice(0,10);
const ym=()=>wibDate().slice(0,7);
const mr=m=>{const [y,mo]=m.split('-').map(Number),n=mo===12?`${y+1}-01`:`${y}-${String(mo+1).padStart(2,'0')}`;return[`${m}-01T00:00:00+07:00`,`${n}-01T00:00:00+07:00`]};
const fdist=(a,b)=>Math.sqrt(a.reduce((s,x,i)=>s+(x-b[i])**2,0));
const getPos=()=>new Promise((res,rej)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>res(p.coords),e=>rej(Error(e.code===1?'Izin lokasi ditolak. Aktifkan izin Lokasi untuk situs ini.':'Lokasi tidak tersedia, nyalakan GPS.')),{enableHighAccuracy:true,timeout:15000,maximumAge:0}):rej(Error('Perangkat tidak mendukung GPS')));
const FACE_URL='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/';
let faceP=null;
function loadFace(){if(faceP)return faceP;faceP=new Promise((res,rej)=>{const go=async()=>{try{const u=FACE_URL+'model';await faceapi.nets.tinyFaceDetector.loadFromUri(u);await faceapi.nets.faceLandmark68TinyNet.loadFromUri(u);await faceapi.nets.faceRecognitionNet.loadFromUri(u);res()}catch(e){rej(e)}};
 if(window.faceapi)return go();const s=document.createElement('script');s.src=FACE_URL+'dist/face-api.js';s.onload=go;s.onerror=()=>rej(Error('gagal'));document.head.appendChild(s)}).catch(()=>{faceP=null;throw Error('Modul pengenalan wajah gagal dimuat. Periksa koneksi internet lalu coba lagi.')});return faceP}
const km=(a,b)=>{const r=Math.PI/180,h=Math.sin((b.lat-a.lat)*r/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin((b.lng-a.lng)*r/2)**2;return 12742*Math.asin(Math.sqrt(h))};

function shrink(file,cb,W=320){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');const k=W/i.width;c.width=W;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(file)}
async function put(d,path){if(!/^(logo|qris)\//.test(path))path=path.replace(/\.jpg$/,'-'+Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(16).padStart(2,'0')).join('')+'.jpg');const b=await (await fetch(d)).blob();const r=await sb.storage.from('files').upload(path,b,{upsert:true,contentType:'image/jpeg'});if(r.error)throw r.error;return sb.storage.from('files').getPublicUrl(path).data.publicUrl+'?v='+Date.now()}
const safe=f=>async(...a)=>{try{await f(...a)}catch(e){alert(e.message||'Terjadi kesalahan')}};

const Card=({t,children,c=''})=><div className={'bg-white rounded-xl shadow p-4 '+c}>{t&&<h3 className="font-semibold mb-3">{t}</h3>}{children}</div>;
const B=({c='bg-sky-600',...p})=><button {...p} className={`${c} text-white rounded-lg px-3 py-2 md:py-1.5 text-sm font-medium disabled:opacity-40 hover:brightness-110 ${p.className||''}`}/>;
const I=p=><input {...p} className={'border rounded-lg px-2 py-2 md:py-1.5 text-sm w-full '+(p.className||'')}/>;
const Sel=({o,...p})=><select {...p} className="border rounded-lg px-2 py-2 md:py-1.5 text-sm w-full">{o.map(x=>Array.isArray(x)?<option key={x[0]} value={x[0]}>{x[1]}</option>:<option key={x}>{x}</option>)}</select>;
const Badge=({s})=><span className={'text-xs px-2 py-0.5 rounded-full '+(String(s).startsWith('Batal')?'bg-red-100 text-red-700':'bg-sky-100 text-sky-700')}>{s}</span>;
function Sig({onSave}){const r=useRef(),d=useRef(false);
 const p=e=>{const b=r.current.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[t.clientX-b.left,t.clientY-b.top]};
 const go=e=>{d.current=true;const c=r.current.getContext('2d');c.beginPath();c.moveTo(...p(e))};
 const mv=e=>{if(!d.current)return;const c=r.current.getContext('2d');c.lineTo(...p(e));c.stroke()};
 const end=()=>{d.current=false;onSave(r.current.toDataURL('image/jpeg',.6))};
 return <canvas ref={r} width={300} height={90} className="border rounded bg-white touch-none max-w-full" onMouseDown={go} onMouseMove={mv} onMouseUp={end} onTouchStart={go} onTouchMove={mv} onTouchEnd={end}/>}
function QR({t}){const r=useRef();useEffect(()=>{r.current.innerHTML='';new QRCode(r.current,{text:t,width:96,height:96})},[t]);return <div ref={r}/>}
function useOrders(){const [o,setO]=useState([]);
 const load=useCallback(()=>sb.from('orders').select('*,customers(name,phone,points,strikes),services(name,unit),addresses(address,lat,lng)').order('created_at',{ascending:false}).limit(200).then(r=>r.data&&setO(r.data)),[]);
 useEffect(()=>{load();const t=setInterval(load,8000);return()=>clearInterval(t)},[]);return[o,load]}

function Setup(){const [a,sa]=useState({u:'',k:''});
 return <Card t="Hubungkan Supabase" c="max-w-sm mx-auto mt-10"><div className="space-y-2 text-sm">
  <I placeholder="Project URL (https://xxxx.supabase.co)" value={a.u} onChange={e=>sa({...a,u:e.target.value.trim()})}/>
  <I placeholder="anon public key" value={a.k} onChange={e=>sa({...a,k:e.target.value.trim()})}/>
  <B className="w-full" onClick={()=>{localStorage.setItem('su',a.u);localStorage.setItem('sk',a.k);location.reload()}}>Simpan & Mulai</B>
  <div className="text-xs text-slate-500">Isi dari Supabase → Project Settings → API. Hanya anon key (publik), jangan service_role.</div></div></Card>}

function PassInput({value,onChange,placeholder}){const [s,setS]=useState(false);
 return <div className="relative"><I type={s?'text':'password'} placeholder={placeholder||'Password'} value={value} onChange={onChange} className="pr-10"/><button type="button" aria-label="Tampilkan atau sembunyikan password" onClick={()=>setS(!s)} className="absolute right-2 top-1.5 text-lg">{s?'🙈':'👁️'}</button></div>}
function Auth({start,back}){const [m,sm]=useState(start||'login'),[a,sa]=useState({name:'',phone:'',email:'',pw:'',code:''});
 const go=safe(async()=>{if(!a.email||a.pw.length<8||(m==='daftar'&&(!a.name||!a.phone)))throw Error('Lengkapi data (password minimal 8 karakter)');
  if(m==='daftar'&&a.code.trim()){const c=await sb.rpc('invite_ok',{c:a.code});if(!c.data)throw Error('Kode undangan tidak valid, sudah dipakai, atau kedaluwarsa')}
  const r=m==='daftar'?await sb.auth.signUp({email:a.email,password:a.pw,options:{data:{full_name:a.name,phone:a.phone,invite_code:a.code.trim()}}}):await sb.auth.signInWithPassword({email:a.email,password:a.pw});
  if(r.error)throw r.error;if(!r.data.session)alert('Cek email Anda untuk konfirmasi, lalu login.')});
 const forgot=safe(async()=>{if(!a.email)throw Error('Isi email dulu, lalu tekan Lupa password');const r=await sb.auth.resetPasswordForEmail(a.email,{redirectTo:location.origin+location.pathname});if(r.error)throw r.error;alert('Link reset password dikirim ke email Anda. Cek inbox atau folder spam.')});
 return <Card t={m==='daftar'?'Daftar':'Masuk'} c="max-w-sm mx-auto mt-10"><div className="space-y-2">
  {m==='daftar'&&<><I placeholder="Nama lengkap" value={a.name} onChange={e=>sa({...a,name:e.target.value})}/><I placeholder="No. WhatsApp" value={a.phone} onChange={e=>sa({...a,phone:e.target.value})}/></>}
  <I type="email" placeholder="Email" value={a.email} onChange={e=>sa({...a,email:e.target.value})}/><PassInput value={a.pw} onChange={e=>sa({...a,pw:e.target.value})}/>
  {m==='daftar'&&<I placeholder="Kode undangan (khusus karyawan, pelanggan kosongkan)" value={a.code} onChange={e=>sa({...a,code:e.target.value})}/>}
  <B className="w-full" onClick={go}>{m==='daftar'?'Daftar':'Masuk'}</B>
  {m==='login'&&<div className="text-xs text-center text-sky-700 cursor-pointer" onClick={forgot}>Lupa password?</div>}
  <div className="text-xs text-center text-sky-700 cursor-pointer" onClick={()=>sm(m==='daftar'?'login':'daftar')}>{m==='daftar'?'Sudah punya akun? Masuk':'Pelanggan baru? Daftar'}</div>
  {back&&<div className="text-xs text-center text-slate-500 cursor-pointer" onClick={back}>← Kembali ke halaman depan</div>}
  <div className="text-xs text-slate-400">Karyawan (kasir/driver/staf): daftar dengan kode undangan dari Owner.</div></div></Card>}
function ResetPass({done}){const [pw,setPw]=useState(''),[p2,setP2]=useState('');
 const ok=safe(async()=>{if(pw.length<8)throw Error('Password minimal 8 karakter');if(pw!==p2)throw Error('Kedua password tidak sama');const r=await sb.auth.updateUser({password:pw});if(r.error)throw r.error;alert('Password berhasil diganti');done()});
 return <Card t="Buat Password Baru" c="max-w-sm mx-auto mt-10"><div className="space-y-2"><PassInput value={pw} onChange={e=>setPw(e.target.value)} placeholder="Password baru"/><PassInput value={p2} onChange={e=>setP2(e.target.value)} placeholder="Ulangi password baru"/><B className="w-full" onClick={ok}>Simpan Password</B></div></Card>}
const UnCtx=React.createContext({un:{},tot:{kasir:0,driver:0,customer:0},refresh:()=>{}});
function UnreadProvider({role,children}){const [r,setR]=useState({un:{},tot:{kasir:0,driver:0,customer:0}});
 const views={owner:['kasir','driver','customer'],kasir:['kasir'],driver:['driver'],customer:['customer']}[role]||[];
 const refresh=useCallback(async()=>{const un={},tot={kasir:0,driver:0,customer:0};
  for(const v of views){const x=await sb.rpc('chat_unread',{v});if(!Array.isArray(x.data))continue;x.data.forEach(z=>{un[z.order_id+'|'+z.channel+'|'+v]=z.n;tot[v]+=z.n})}setR({un,tot})},[role]);
 useEffect(()=>{refresh();const i=setInterval(refresh,8000);return()=>clearInterval(i)},[role]);
 const all=r.tot.kasir+r.tot.driver+r.tot.customer;
 useEffect(()=>{document.title=(all>0?`(${all}) `:'')+(CFG.name||'LaundryKu')},[all]);
 return <UnCtx.Provider value={{...r,refresh}}>{children}</UnCtx.Provider>}
const Bdg=({n})=>n>0?<span className="ml-1.5 inline-flex min-w-[1.25rem] h-5 px-1 items-center justify-center rounded-full bg-red-600 text-white text-xs font-bold ring-2 ring-white">{n>99?'99+':n}</span>:null;
function UnBanner({view}){const {tot}=useContext(UnCtx),n=tot[view];return n>0?<div className="bg-red-50 border border-red-300 text-red-700 rounded-lg px-3 py-2 text-sm font-semibold mb-3">🔔 {n} pesan chat belum dibaca</div>:null}
function TabBtn({x,cur,role,on}){const {tot}=useContext(UnCtx);const n=x==='Kasir'&&(role==='kasir'||role==='owner')?tot.kasir:x==='Driver'&&(role==='driver'||role==='owner')?tot.driver:x==='Pelanggan'&&(role==='customer'||role==='owner')?tot.customer:0;
 return <B c={cur===x?'bg-sky-600':'bg-slate-400'} onClick={()=>on(x)}>{x}<Bdg n={n}/></B>}
function Chat({o,u,close,ch='kasir',view='kasir'}){const [m,setM]=useState([]),[t,setT]=useState(''),[b,setB]=useState(false),end=useRef(),last=useRef(0),{refresh}=useContext(UnCtx);
 const ld=async()=>{const r=await sb.from('order_messages').select('*').eq('order_id',o.id).eq('channel',ch).order('created_at');if(!r.data)return;setM(r.data);const l=r.data.length?r.data[r.data.length-1].id:0;if(l&&l!==last.current){last.current=l;await sb.rpc('chat_mark_read',{oid:o.id,ch,v:view==='customer'?'customer':'staff'});refresh()}};
 useEffect(()=>{ld();const i=setInterval(ld,5000);return()=>clearInterval(i)},[o.id,ch,view]);
 useEffect(()=>{end.current&&end.current.scrollIntoView()},[m.length]);
 const send=safe(async()=>{const s=t.trim();if(!s)return;setB(true);try{const r=await sb.from('order_messages').insert({order_id:o.id,sender_id:u.id,body:s,channel:ch,sender_role:view==='customer'?'customer':'staff'});if(r.error)throw r.error;setT('');ld()}finally{setB(false)}});
 return <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"><div className="bg-white rounded-xl w-full max-w-sm flex flex-col" style={{maxHeight:'85vh'}}>
  <div className="p-3 border-b flex justify-between items-center"><b>{ch==='driver'?'🛵 Chat kurir':'💬 Chat laundry'} · {o.id}</b><B c="bg-slate-500" onClick={close}>Tutup</B></div>
  <div className="p-3 overflow-auto flex-1 space-y-2 text-sm">{m.length?m.map(x=>{const me=x.sender_id===u.id;return <div key={x.id} className={me?'text-right':''}><div className={'inline-block max-w-[85%] rounded-lg px-3 py-1.5 text-left '+(x.sender_role==='system'?'bg-amber-50 border border-amber-200':me?'bg-sky-100':'bg-slate-100')}>
   <div className="text-[10px] text-slate-500">{x.sender_role==='system'?'Sistem':me?'Anda':x.sender_role==='staff'?(ch==='driver'?'Kurir/Staf':'Staf laundry'):'Pelanggan'} · {new Date(x.created_at).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>{x.body}{x.image_url&&<a href={okUrl(x.image_url)} target="_blank" rel="noopener noreferrer"><img src={x.image_url} className="h-20 mt-1 rounded"/></a>}</div></div>}):<div className="text-slate-400">{ch==='driver'?'Belum ada pesan. Gunakan untuk konfirmasi lokasi/patokan rumah antara pelanggan dan kurir.':'Belum ada pesan. Tulis pesan khusus atau konfirmasi di bawah.'}</div>}<div ref={end}/></div>
  <div className="p-3 border-t flex gap-2"><I placeholder="Tulis pesan…" value={t} maxLength={1000} onChange={e=>setT(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}/><B disabled={b||!t.trim()} onClick={send}>Kirim</B></div></div></div>}
function useLastMsg(){const [m,setM]=useState({});
 useEffect(()=>{const ld=()=>sb.from('order_messages').select('order_id,sender_role,created_at').order('created_at',{ascending:false}).limit(300).then(r=>{if(!r.data)return;const z={};r.data.forEach(x=>{if(!z[x.order_id])z[x.order_id]=x});setM(z)});ld();const i=setInterval(ld,8000);return()=>clearInterval(i)},[]);return m}
function EstStandar({st,reload}){const [d,setD]=useState(st.regular_days||'2'),[h,setH]=useState(st.express_hours||'6');
 const save=safe(async()=>{const r=await sb.from('settings').upsert([{key:'regular_days',value:String(d)},{key:'express_hours',value:String(h)}]);if(r.error)throw r.error;reload();alert('Estimasi standar tersimpan')});
 return <Card t="Estimasi Waktu Selesai"><div className="text-xs text-slate-500 mb-2">Tampil sebagai catatan di panel pelanggan dan menjadi estimasi awal pesanan baru. Bisa diubah per pesanan lewat tombol "Estimasi" sesuai antrean.</div>
  <div className="grid grid-cols-2 gap-2"><label className="text-xs">Reguler (hari)<I type="number" min="0.5" step="0.5" value={d} onChange={e=>setD(e.target.value)}/></label><label className="text-xs">Ekspres (jam)<I type="number" min="1" value={h} onChange={e=>setH(e.target.value)}/></label></div><B className="mt-2" onClick={save}>Simpan</B></Card>}
function Pesanan({x,st,u,load}){const [chat,setChat]=useState(false),[pf,setPf]=useState(null),[b,setB]=useState(false),{un}=useContext(UnCtx);
 const cancel=safe(async()=>{if(!confirm('Batalkan pesanan '+x.id+'? Pesanan yang sudah dijemput tidak bisa dibatalkan sendiri.'))return;const r=await sb.rpc('cancel_my_order',{oid:x.id});if(r.error)throw r.error;load()});
 const wait=x.services.unit==='kg'&&+x.qty===0,paid=x.pay_status==='lunas',needPay=!paid&&x.pay_status==='belum_bayar'&&x.pay_method!=='COD'&&!wait;
 const lbl=paid?'Lunas ✓':x.pay_status==='menunggu_verifikasi'?'Bukti bayar menunggu verifikasi kasir':x.pay_method==='COD'?'Bayar tunai saat diterima':wait?'Bayar setelah ditimbang':'Belum dibayar';
 const send=safe(async()=>{if(!pf)throw Error('Pilih foto bukti pembayaran');setB(true);try{const url=await put(pf,`proofs/${u.id}/${x.id}-${Date.now()}.jpg`);const r=await sb.rpc('submit_proof',{oid:x.id,url});if(r.error)throw r.error;setPf(null);load()}finally{setB(false)}});
 return <div className="mb-4 pb-3 border-b text-sm">
  <div className="flex justify-between items-center"><b>{x.id}</b><Badge s={x.status}/></div>
  <div className="text-xs text-slate-500">{x.services.name}{x.express?' · Ekspres':''} · {wait?'berat menunggu ditimbang':x.qty+' '+x.services.unit} · {x.pay_method}</div>
  <div className="mt-1"><span className={'text-xs px-2 py-0.5 rounded-full '+(paid?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700')}>{lbl}</span>{!wait&&<b className="ml-2">{rp(x.total)}</b>}</div>
  {x.status!=='Diterima'&&x.est_done_at&&<div className="text-xs text-slate-500 mt-1">⏱️ Estimasi selesai: {fd(x.est_done_at)} ({x.express?'Ekspres':'Reguler'})</div>}
  {wait&&<div className="text-xs bg-sky-50 rounded p-2 mt-1">⚖️ Cucian akan ditimbang kasir di outlet. Foto timbangan dan rincian biaya akan muncul di sini dan di chat.</div>}
  {x.weigh_photo_url&&<div className="text-xs mt-2 bg-slate-50 rounded p-2 flex gap-2"><a href={okUrl(x.weigh_photo_url)} target="_blank" rel="noopener noreferrer"><img src={x.weigh_photo_url} className="h-14 rounded"/></a>
   <div>{x.services.unit==='kg'?'Hasil timbangan':'Jumlah dikonfirmasi kasir'}: <b>{x.qty} {x.services.unit}</b>{x.qty_estimate!=null?` (estimasi awal ${x.qty_estimate})`:''}<br/>Subtotal {rp(x.subtotal||0)} · Antar-jemput {rp(x.delivery_fee||0)}{x.discount>0?` · Diskon -${rp(x.discount)}`:''}<br/><b>Total {rp(x.total)}</b></div></div>}
  {needPay&&<div className="bg-amber-50 rounded p-2 mt-2 space-y-2 text-xs"><div className="font-semibold">{x.status==='Diterima'?'Pembayaran belum tercatat. ':''}Bayar {rp(x.total)}</div>
   {x.pay_method==='QRIS'?(st.qris_url?<img src={st.qris_url} className="w-40 rounded border"/>:<div className="text-red-600">QRIS belum diunggah outlet.</div>):<div>Transfer ke <b>{st.rekening||'(rekening belum diisi outlet)'}</b></div>}
   <label className="block">Unggah bukti pembayaran<input type="file" accept="image/*" onChange={e=>e.target.files[0]&&shrink(e.target.files[0],setPf,600)}/></label>{pf&&<img src={pf} className="h-16 rounded"/>}
   <B disabled={b||!pf} onClick={send}>{b?'Mengirim…':'Kirim Bukti Bayar'}</B></div>}
  {x.status==='Batal'?<div className="text-xs text-red-600 mt-2">❌ Pesanan dibatalkan.</div>:<div className="h-2 bg-slate-200 rounded mt-2"><div className="h-2 bg-sky-500 rounded" style={{width:Math.max(0,ST.indexOf(x.status))/5*100+'%'}}/></div>}
  <div className="mt-2 flex gap-2 flex-wrap"><B c="bg-slate-700" onClick={()=>setChat('kasir')}>💬 Chat dengan laundry<Bdg n={un[x.id+'|kasir|customer']}/></B>
   {!['Diterima','Batal'].includes(x.status)&&<B c="bg-teal-600" onClick={()=>setChat('driver')}>🛵 Chat kurir<Bdg n={un[x.id+'|driver|customer']}/></B>}
   {x.status==='Dipesan'&&<B c="bg-red-600" onClick={cancel}>Batalkan pesanan</B>}</div>

   <B className="w-full py-3 text-base" onClick={onStart}>✨ Buat Akun & Pesan Sekarang</B>
   <div className="text-center text-sm text-slate-600">Sudah punya akun? <span className="text-sky-700 font-semibold cursor-pointer" onClick={onLogin}>Masuk</span></div>
   <div className="text-[11px] text-center text-slate-400">Karyawan (kasir/kurir/staf): masuk atau daftar dengan kode undangan dari Owner.</div></div></div>}
function HalamanDepan({st,reload}){const [v,setV]=useState(st.landing_text||LAND_DEF),[pv,setPv]=useState(false);
 const save=safe(async()=>{const r=await sb.from('settings').upsert({key:'landing_text',value:v.slice(0,500)});if(r.error)throw r.error;reload();alert('Halaman depan tersimpan')});
 return <Card t="Halaman Depan (calon pelanggan)" c="md:col-span-2"><div className="text-xs text-slate-500 mb-2">Teks ini tampil pertama kali saat orang membuka alamat web Anda, diakhiri tombol "Buat Akun & Pesan". Logo, nama usaha, alamat, dan telepon diambil dari "Profil & Tampilan Nota".</div>
  <textarea className="border rounded-lg px-2 py-2 text-sm w-full" rows="7" maxLength={500} value={v} onChange={e=>setV(e.target.value)}/>
  <div className="flex items-center gap-2 mt-1"><span className={'text-xs '+(v.length>=480?'text-red-600':'text-slate-500')}>{v.length}/500 karakter</span><B onClick={save}>Simpan</B><B c="bg-slate-500" onClick={()=>setPv(!pv)}>{pv?'Tutup pratinjau':'Pratinjau'}</B><B c="bg-slate-400" onClick={()=>setV(LAND_DEF)}>Isi contoh</B></div>
  {pv&&<div className="mt-3"><LandingCard preview st={{...st,landing_text:v}} onStart={()=>{}} onLogin={()=>{}}/></div>}</Card>}
function AturanCOD({st,reload}){const K=[['cod_min_done','Pesanan selesai minimal sebelum pelanggan boleh COD','1'],['cod_max_open','Maksimal pesanan COD yang sedang berjalan','1'],['cod_strike_limit','COD dimatikan setelah pelanggaran ke-','2'],['order_strike_limit','Akun dibatasi (tidak bisa pesan) setelah pelanggaran ke-','4']];
 const [v,setV]=useState(()=>Object.fromEntries(K.map(([k,,d])=>[k,st[k]||d]))),[bad,setBad]=useState([]);
 const ld=()=>sb.from('customers').select('id,name,phone,strikes').gt('strikes',0).order('strikes',{ascending:false}).then(r=>r.data&&setBad(r.data));useEffect(()=>{ld()},[]);
 const save=safe(async()=>{const r=await sb.from('settings').upsert(K.map(([k])=>({key:k,value:String(Math.max(0,parseInt(v[k])||0))})));if(r.error)throw r.error;reload();alert('Aturan tersimpan')});
 const reset=safe(async c=>{const r=await sb.from('customers').update({strikes:0}).eq('id',c.id);if(r.error)throw r.error;ld()});
 return <Card t="Aturan Anti Order Fiktif (COD)" c="md:col-span-2"><div className="text-xs text-slate-500 mb-2">Pelanggaran dicatat saat kurir/kasir melaporkan pelanggan tidak ditemui. Pelanggan baru tidak bisa COD sampai pesanan pertamanya selesai.</div>
  <div className="grid md:grid-cols-2 gap-2">{K.map(([k,l])=><label key={k} className="text-xs">{l}<I type="number" min="0" value={v[k]} onChange={e=>setV({...v,[k]:e.target.value})}/></label>)}</div><B className="mt-2" onClick={save}>Simpan Aturan</B>
  <div className="text-sm font-semibold mt-4">Pelanggan dengan pelanggaran</div>{bad.length?bad.map(c=><div key={c.id} className="flex items-center gap-2 py-1 text-sm border-b"><span className="flex-1">{c.name} · {c.phone}</span><span className="text-red-600 font-semibold">{c.strikes}×</span><B c="bg-slate-500" onClick={()=>reset(c)}>Reset</B></div>):<div className="text-xs text-slate-400">Belum ada.</div>}</Card>}
function App(){const [u,setU]=useState(undefined),[rec,setRec]=useState(false),[role,setRole]=useState(null),[tab,setTab]=useState(null),[sv,setSv]=useState([]),[st,setSt]=useState({}),[gate,setGate]=useState('landing'),[am,setAm]=useState('daftar'),[stOk,setStOk]=useState(false);
 const loadSv=()=>sb.from('services').select('*').eq('active',true).order('id').then(r=>setSv(r.data||[]));
 const reload=()=>sb.from('settings').select('*').then(r=>setSt(Object.fromEntries((r.data||[]).map(x=>[x.key,x.value]))));
 useEffect(()=>{if(!sb)return;sb.auth.getSession().then(({data})=>setU(data.session?data.session.user:null));const {data:l}=sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY')setRec(true);setU(s?s.user:null)});return()=>l.subscription.unsubscribe()},[]);
 useEffect(()=>{if(!u)return setRole(null);sb.from('profiles').select('role').eq('id',u.id).maybeSingle().then(r=>setRole(r.data?r.data.role:'customer'));loadSv();reload()},[u]);
 useEffect(()=>{if(sb&&u===null)Promise.resolve(reload()).then(()=>setStOk(true),()=>setStOk(true))},[u]);
 if(!sb)return <Setup/>;if(u===undefined)return null;if(rec&&u)return <ResetPass done={()=>setRec(false)}/>;if(!u)return gate==='auth'?<div className="p-3"><Auth start={am} back={()=>setGate('landing')}/></div>:<div className="p-3 pt-6">{stOk?<LandingCard st={st} onStart={()=>{setAm('daftar');setGate('auth')}} onLogin={()=>{setAm('login');setGate('auth')}}/>:<div className="text-center text-sm text-slate-500 mt-24">Memuat…</div>}</div>;if(!role)return <div className="p-4 text-sm">Memuat…</div>;
 const T={customer:['Pelanggan'],driver:['Driver'],kasir:['Kasir'],karyawan:['Absensi'],owner:['Owner','Kasir','Driver','Pelanggan']}[role],cur=tab&&T.includes(tab)?tab:T[0];
 return <UnreadProvider role={role}><div className="max-w-6xl mx-auto p-3"><header className="sticky top-0 z-30 bg-slate-100/95 backdrop-blur py-2 flex flex-wrap items-center gap-2 mb-4"><h1 className="text-xl font-bold text-sky-700">🧺 {CFG.name||'LaundryKu'}</h1><span className="text-xs text-slate-500">{u.email} · {role}</span>
  <nav className="ml-auto flex gap-1 flex-wrap">{T.length>1&&T.map(x=><TabBtn key={x} x={x} cur={cur} role={role} on={setTab}/>)}<B c="bg-slate-600" onClick={()=>sb.auth.signOut()}>Keluar</B></nav></header>
  {cur==='Pelanggan'?<Customer u={u} sv={sv} st={st}/>:cur==='Absensi'?<div className="max-w-md mx-auto"><Absen u={u}/></div>:cur==='Driver'?<Driver u={u} st={st}/>:cur==='Kasir'?<Kasir sv={sv} st={st} u={u} reload={reload}/>:<Owner st={st} reload={reload} sv={sv} reloadSv={loadSv}/>}</div></UnreadProvider>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
